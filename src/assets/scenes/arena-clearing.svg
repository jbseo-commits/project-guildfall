  <rect x="1321" y="243" width="38" height="51" rx="7" fill="#251b15" stroke="#8d6938" stroke-width="4"/>
  <circle cx="262" cy="268" r="74" fill="url(#warm)" filter="url(#blur12)"/>
  <circle cx="1340" cy="268" r="74" fill="url(#warm)" filter="url(#blur12)"/>
  <rect x="251" y="251" width="22" height="34" rx="5" fill="#ffc45a"/>
  <rect x="1329" y="251" width="22" height="34" rx="5" fill="#ffc45a"/>
</g>

<!-- glowing flora -->
<g>
  <circle cx="360" cy="366" r="92" fill="url(#cyan)" filter="url(#blur12)"/>
  <circle cx="1190" cy="370" r="96" fill="url(#violet)" filter="url(#blur12)"/>
  <g fill="#6ec0d8" stroke="#b9efff" stroke-width="2">
    <path d="M322 403 l22 -60 18 53 -10 18Z"/>
    <path d="M365 408 l16 -45 14 39 -7 13Z"/>
