  <ellipse cx="1120" cy="135" rx="210" ry="82"/>
  <ellipse cx="1390" cy="125" rx="210" ry="80"/>
</g>

<!-- side rock walls -->
<g fill="url(#rock)" stroke="#242c29" stroke-width="5" opacity=".92">
  <path d="M0 280 L78 228 137 258 198 216 242 268 306 238 354 311 324 392 250 405 188 384 125 410 62 392 0 418Z"/>
  <path d="M1600 285 L1528 235 1465 264 1404 220 1356 271 1297 242 1240 316 1269 393 1347 410 1415 384 1474 414 1537 391 1600 422Z"/>
</g>

