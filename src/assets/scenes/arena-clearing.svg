  <ellipse cx="180" cy="478" rx="68" ry="22"/><ellipse cx="1420" cy="480" rx="76" ry="24"/>
  <ellipse cx="520" cy="548" rx="43" ry="15"/><ellipse cx="1055" cy="545" rx="50" ry="16"/>
</g>
<g fill="#696454" opacity=".72">
  <path d="M150 456 l44 -26 54 18 15 28 -49 12Z"/>
  <path d="M1350 459 l46 -28 59 16 17 29 -57 13Z"/>
</g>
<g stroke="#302d26" stroke-width="7" fill="none" opacity=".62">
  <path d="M35 550 Q160 522 266 544 T492 540"/>
  <path d="M1120 547 Q1260 520 1380 546 T1580 538"/>
</g>

<!-- texture / vignette -->
<rect width="1600" height="620" filter="url(#grain)" opacity=".5"/>
<rect width="1600" height="620" fill="none" stroke="#05070a" stroke-width="34" opacity=".24"/>
</svg>