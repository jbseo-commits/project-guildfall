<path d="M0 454 C230 425 401 430 587 462 C786 497 1015 492 1212 451 C1389 414 1503 422 1600 441" fill="none" stroke="#8b775a" stroke-width="4" opacity=".38"/>
<path d="M0 518 C207 490 405 492 595 525 C807 562 1002 557 1215 515 C1398 479 1508 485 1600 503" fill="none" stroke="#2c2e29" stroke-width="4" opacity=".45"/>

