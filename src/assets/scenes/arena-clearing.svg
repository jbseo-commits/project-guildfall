  <circle cx="1490" cy="350" r="62"/><circle cx="1384" cy="355" r="70"/><circle cx="1298" cy="366" r="54"/>
</g>

<!-- lanterns -->
<g>
  <rect x="254" y="220" width="15" height="175" rx="7" fill="#564535"/>
  <rect x="1332" y="220" width="15" height="175" rx="7" fill="#564535"/>
  <path d="M234 227 H290 L281 245 H243Z" fill="#191817"/>
  <path d="M1312 227 H1368 L1359 245 H1321Z" fill="#191817"/>
