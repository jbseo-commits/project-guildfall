<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620">
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#1a2740"/><stop offset=".42" stop-color="#26394a"/><stop offset="1" stop-color="#111820"/>
  </linearGradient>
  <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#665c49"/><stop offset=".36" stop-color="#5c5444"/><stop offset="1" stop-color="#34342e"/>
  </linearGradient>
  <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#14191d"/><stop offset=".5" stop-color="#2d2d2a"/><stop offset="1" stop-color="#11161a"/>
  </linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#4d5450"/><stop offset=".55" stop-color="#303734"/><stop offset="1" stop-color="#1d2423"/>
  </linearGradient>
  <radialGradient id="warm"><stop stop-color="#ffe7a4"/><stop offset=".28" stop-color="#ffb449" stop-opacity=".96"/><stop offset=".68" stop-color="#d06b2a" stop-opacity=".26"/><stop offset="1" stop-color="#d06b2a" stop-opacity="0"/></radialGradient>
  <radialGradient id="cyan"><stop stop-color="#a9f0ff" stop-opacity=".85"/><stop offset=".4" stop-color="#58b7d6" stop-opacity=".34"/><stop offset="1" stop-color="#4f9fbc" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#edb5ff" stop-opacity=".82"/><stop offset=".42" stop-color="#a562cf" stop-opacity=".32"/><stop offset="1" stop-color="#8748ad" stop-opacity="0"/></radialGradient>
  <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="4" seed="12" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
  </filter>
</defs>

<rect width="1600" height="620" fill="url(#night)"/>

<!-- distant forest -->
<g opacity=".92">
  <g fill="#182128">
    <path d="M0 0 H105 L120 372 L58 430 H0Z"/>
    <path d="M92 0 H175 L194 356 L138 428 L105 390Z"/>
    <path d="M190 0 H252 L270 333 L228 405 L190 362Z"/>
    <path d="M1350 0 H1417 L1404 357 L1368 422 L1337 356Z"/>
    <path d="M1420 0 H1504 L1486 384 L1448 426 L1410 365Z"/>
    <path d="M1500 0 H1600 V430 L1536 379Z"/>
  </g>
  <g fill="url(#trunk)" opacity=".8">
    <path d="M310 0 H350 L366 334 L318 362Z"/>
    <path d="M405 0 H440 L454 314 L414 355Z"/>
    <path d="M1160 0 H1198 L1184 327 L1147 352Z"/>
    <path d="M1250 0 H1288 L1269 340 L1233 365Z"/>
  </g>
</g>

<!-- canopy -->
<g fill="#172620" opacity=".96">
  <ellipse cx="120" cy="72" rx="190" ry="96"/>
  <ellipse cx="345" cy="84" rx="210" ry="110"/>
  <ellipse cx="560" cy="68" rx="182" ry="88"/>
