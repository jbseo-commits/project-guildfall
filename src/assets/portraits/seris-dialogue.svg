<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520">
<defs>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f0ff"/><stop offset=".48" stop-color="#c9c8ea"/><stop offset="1" stop-color="#888dbb"/></linearGradient>
  <linearGradient id="hairShade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8caee"/><stop offset="1" stop-color="#7479aa"/></linearGradient>
  <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#273451"/><stop offset=".48" stop-color="#53679d"/><stop offset="1" stop-color="#1b2239"/></linearGradient>
  <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e2944"/><stop offset="1" stop-color="#0d1223"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2ea"/><stop offset=".55" stop-color="#f5d8d2"/><stop offset="1" stop-color="#ddb8b7"/></linearGradient>
  <radialGradient id="eye"><stop stop-color="#d8f5ff"/><stop offset=".42" stop-color="#79aee8"/><stop offset="1" stop-color="#334b8b"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<g opacity=".28">
  <circle cx="190" cy="244" r="165" fill="#8ea8e8"/>
  <circle cx="160" cy="210" r="130" fill="#d5d6ff"/>
</g>

