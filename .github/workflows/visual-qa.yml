name: Visual QA

on:
  pull_request:
    branches:
      - main

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app
        run: npm install
      - name: Build
        run: npm run build
      - name: Install visual QA tools
        run: |
          npm install --no-save playwright wait-on
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/guildfall-preview.log 2>&1 &
          npx wait-on http://127.0.0.1:4173
      - name: Capture actual game screenshots
        run: |
          mkdir -p visual-qa
          cat > capture.cjs <<'NODE'
          const { chromium } = require('playwright');

          async function capture(width, height, prefix) {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            await page.waitForTimeout(600);
            await page.screenshot({ path: 'visual-qa/' + prefix + '-story.png' });

            for (let i = 0; i < 8; i++) {
              const storyNext = page.locator('#storyNext');
              if (!(await storyNext.count())) break;
              await storyNext.click();
              await page.waitForTimeout(120);
            }

            await page.screenshot({ path: 'visual-qa/' + prefix + '-read.png' });
            await page.locator('#readNext').click();
            await page.waitForTimeout(350);
            await page.screenshot({ path: 'visual-qa/' + prefix + '-placement.png' });

            await page.locator('#commit').click();
            const battleStartedAt = Date.now();

            async function shotAt(offset, name) {
              const elapsed = Date.now() - battleStartedAt;
              const remaining = Math.max(0, offset - elapsed);
              if (remaining) await page.waitForTimeout(remaining);
              await page.screenshot({ path: 'visual-qa/' + prefix + '-' + name + '.png' });
            }

            await shotAt(980, 'battle-charge');
            await shotAt(2800, 'battle-intercept');
            await page.screenshot({ path: 'visual-qa/' + prefix + '-battle.png' });
            await shotAt(5650, 'battle-burst');
            await shotAt(7100, 'battle-finish');
            await shotAt(8300, 'result');

            if (await page.locator('#postBattle').count()) {
              await page.locator('#postBattle').click();
              await page.waitForTimeout(180);
              await page.screenshot({ path: 'visual-qa/' + prefix + '-aftermath.png' });

              for (let i = 0; i < 8; i++) {
                const next = page.locator('#aftermathNext');
                if (!(await next.count())) break;
                await next.click();
                await page.waitForTimeout(100);
              }
              await page.screenshot({ path: 'visual-qa/' + prefix + '-route-choice.png' });
            }

            await browser.close();
          }

          (async () => {
            await capture(1388, 550, 'mobile-landscape');
            await capture(1536, 864, 'desktop-16x9');
          })();
          NODE
          node capture.cjs
      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: guildfall-visual-qa
          path: visual-qa
          retention-days: 7
