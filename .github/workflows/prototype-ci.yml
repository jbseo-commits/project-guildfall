name: Prototype CI

on:
  push:
    branches:
      - main
      - prototype/living-caravan-slice-v1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run deterministic engine tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: living-caravan-preview
          path: ./dist
